<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 300" role="img" aria-labelledby="title desc">
<title id="title">Santa Claus en su trineo volador</title><desc id="desc">Santa vuela por el cielo navideño con cuatro renos y una nariz roja luminosa en el reno delantero.</desc>
<defs>
 <linearGradient id="coat" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f05a50"/><stop offset="1" stop-color="#a71832"/></linearGradient>
 <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffe9ad"/><stop offset="1" stop-color="#b98231"/></linearGradient>
 <linearGradient id="fur" x1="0" y1="0" x2="0.8" y2="1"><stop stop-color="#bd8a61"/><stop offset="1" stop-color="#70472f"/></linearGradient>
 <radialGradient id="nose"><stop stop-color="#fff5ce"/><stop offset=".35" stop-color="#ff493e"/><stop offset="1" stop-color="#bf102a"/></radialGradient>
 <filter id="shadow" x="-20%" y="-30%" width="150%" height="170%"><feDropShadow dx="0" dy="8" stdDeviation="7" flood-color="#142b40" flood-opacity=".28"/></filter>
 <g id="deer" filter="url(#shadow)">
  <ellipse cx="46" cy="184" rx="37" ry="16" fill="url(#fur)"/><path d="M67 183Q82 158 76 137l17-9q13 22 3 57l-12 13Z" fill="url(#fur)"/><ellipse cx="98" cy="136" rx="19" ry="14" fill="#a87953"/>
  <path d="M85 128Q72 116 76 108q14 5 19 17M101 124q6-17 18-17-2 15-13 23" fill="#875b3d"/><path d="M90 126Q83 112 88 100M88 111l-11-7m12 1 8-10m13 34q5-14 4-23m0 11 9-8m-10 2-5-12" fill="none" stroke="#9b7443" stroke-width="5" stroke-linecap="round"/>
  <ellipse cx="113" cy="142" rx="10" ry="7" fill="#d4a274"/><circle cx="108" cy="133" r="2.4" fill="#192331"/><circle class="nose" cx="121" cy="142" r="5" fill="#61402f"/>
  <g fill="none" stroke="#70472f" stroke-width="7" stroke-linecap="round"><path class="leg hind-a" d="M20 194L12 229"/><path class="leg hind-b" d="M41 194L39 230"/><path class="leg fore-a" d="M68 194L75 228"/><path class="leg fore-b" d="M87 190L100 222"/></g><g fill="none" stroke="#302d2a" stroke-width="5" stroke-linecap="round"><path d="M8 230h9"/><path d="M35 231h9"/><path d="M71 229h9"/><path d="M97 223h9"/></g><path d="M35 171q20 22 48 2" fill="none" stroke="#d8b263" stroke-width="3"/>
 </g>
</defs>
<g class="trail" fill="#fff" opacity=".8"><circle cx="24" cy="115" r="3"/><circle cx="5" cy="143" r="2"/><circle cx="38" cy="164" r="2.5"/><path d="M70 103h45M52 132h30M78 158h38" stroke="#fff" stroke-width="2" stroke-linecap="round"/></g>
<g transform="translate(365 0) scale(-1 1) translate(-510 0)" filter="url(#shadow)">
 <path d="M548 203q36 26 96 22h120q26 0 35-18l-8-4q-13 13-34 12H644q-41 0-71-21Z" fill="none" stroke="url(#gold)" stroke-width="9" stroke-linecap="round"/>
 <path d="M571 191q6-32 28-48h138q29 0 43 47l-18 20H592Z" fill="url(#coat)" stroke="#8f172b" stroke-width="4"/><path d="M589 185h175M600 164h160" stroke="#f4d888" stroke-width="4" opacity=".9"/>
 <path d="M608 145q12-22 33-24h38q25 0 38 25Z" fill="#263d55"/><path d="M624 136q12-36 44-35 29 1 38 34l-16 11h-53Z" fill="url(#coat)"/><circle cx="668" cy="99" r="8" fill="#fff5e9"/><path d="M624 133q42-12 81 1l-2 13q-39-12-77 0Z" fill="#fff6eb"/><circle cx="631" cy="140" r="6" fill="#fff"/><circle cx="695" cy="140" r="6" fill="#fff"/>
 <ellipse cx="667" cy="135" rx="20" ry="21" fill="#f3bd91"/><path d="M647 142q19-4 39 1l12 18q-7 20-28 22-23-3-29-23Z" fill="#fff8ef"/><circle cx="660" cy="134" r="2" fill="#27374a"/><circle cx="674" cy="134" r="2" fill="#27374a"/><path d="M663 146q5 4 10 0" fill="none" stroke="#9f4a43" stroke-width="2" stroke-linecap="round"/>
 <path d="M637 161q29 11 57 0l21 39q-47 24-96-1Z" fill="url(#coat)"/><path d="M637 161q29 11 57 0l-2 10q-27 12-53 0Z" fill="#fff6eb"/><path d="M663 172v17" stroke="#f0d48a" stroke-width="4"/><circle cx="663" cy="177" r="2" fill="#fff"/><circle cx="663" cy="187" r="2" fill="#fff"/><path d="M604 155q-22 5-27 20l30 8m99-28q19 2 27 20l-27 8" fill="none" stroke="#be8a63" stroke-width="10" stroke-linecap="round"/>
 <g><rect x="716" y="126" width="33" height="34" rx="5" fill="#2d8b69"/><path d="M732 126v34m-16-17h33" stroke="#f0d480" stroke-width="5"/><rect x="750" y="139" width="25" height="25" rx="4" fill="#e3b951"/><path d="M762 139v25m-12-13h25" stroke="#c43b42" stroke-width="4"/></g>
</g>
<g fill="none" stroke="#a7783c" stroke-width="2.5" stroke-linecap="round"><path d="M390 177Q330 150 275 177"/><path d="M500 177Q400 146 275 177"/><path d="M610 177Q465 155 275 177"/><path d="M720 177Q530 164 275 177"/></g>
<g transform="translate(320 0)"><g class="deer-run deer-run-1"><use href="#deer"/></g></g><g transform="translate(430 -8)"><g class="deer-run deer-run-2"><use href="#deer"/></g></g><g transform="translate(540 2)"><g class="deer-run deer-run-3"><use href="#deer"/></g></g><g transform="translate(650 -7)"><g class="deer-run deer-run-4 rudolph"><use href="#deer"/><circle class="red-nose" cx="121" cy="142" r="7" fill="url(#nose)"/></g></g>

<style>.rudolph .red-nose{filter:drop-shadow(0 0 3px #ff554e);transform-box:fill-box;transform-origin:center;animation:nosePulse .72s ease-in-out infinite alternate}.trail{animation:trailGlow 1.8s ease-in-out infinite alternate}.deer-run{transform-box:fill-box;transform-origin:50% 68%;animation:deerBob .48s ease-in-out infinite alternate}.deer-run-2{animation-delay:-.12s}.deer-run-3{animation-delay:-.24s}.deer-run-4{animation-delay:-.36s}.leg{transform-box:view-box;transform-origin:50% 50%}.hind-a{transform-origin:20px 194px;animation:gallopBackA .48s ease-in-out infinite alternate}.hind-b{transform-origin:41px 194px;animation:gallopBackB .48s ease-in-out infinite alternate}.fore-a{transform-origin:68px 194px;animation:gallopFrontA .48s ease-in-out infinite alternate}.fore-b{transform-origin:87px 190px;animation:gallopFrontB .48s ease-in-out infinite alternate}.deer-run-2 .leg{animation-delay:-.12s}.deer-run-3 .leg{animation-delay:-.24s}.deer-run-4 .leg{animation-delay:-.36s}@keyframes gallopBackA{from{transform:rotate(28deg)}to{transform:rotate(-30deg)}}@keyframes gallopBackB{from{transform:rotate(-27deg)}to{transform:rotate(32deg)}}@keyframes gallopFrontA{from{transform:rotate(-30deg)}to{transform:rotate(29deg)}}@keyframes gallopFrontB{from{transform:rotate(32deg)}to{transform:rotate(-28deg)}}@keyframes deerBob{from{transform:translateY(1px) rotate(-1deg)}to{transform:translateY(-4px) rotate(1deg)}}@keyframes nosePulse{to{filter:drop-shadow(0 0 11px #ff241f);opacity:.78;transform:scale(1.15)}}@keyframes trailGlow{to{opacity:.35;transform:translateX(-6px)}}</style>
</svg>