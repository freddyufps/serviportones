<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 190" role="img" aria-labelledby="title desc">
<title id="title">Gorro navideño rojo con luces</title><desc id="desc">Gorro de Santa tridimensional con borde de felpa blanco, destellos y pom pom.</desc>
<defs>
 <linearGradient id="red" x1=".1" y1=".9" x2=".9" y2=".1"><stop stop-color="#7f1422"/><stop offset=".32" stop-color="#c82d3b"/><stop offset=".66" stop-color="#f05a60"/><stop offset="1" stop-color="#a51d2e"/></linearGradient>
 <linearGradient id="fur" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#fff"/><stop offset=".46" stop-color="#f6f3ee"/><stop offset=".72" stop-color="#d9d7d4"/><stop offset="1" stop-color="#fff"/></linearGradient>
 <radialGradient id="pom" cx="32%" cy="25%"><stop stop-color="#fff"/><stop offset=".6" stop-color="#f6f4ef"/><stop offset="1" stop-color="#cbc9c7"/></radialGradient>
 <filter id="shadow" x="-30%" y="-25%" width="170%" height="170%"><feDropShadow dx="1" dy="8" stdDeviation="6" flood-color="#30121a" flood-opacity=".32"/></filter>
 <filter id="glow"><feGaussianBlur stdDeviation="3" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<g filter="url(#shadow)" transform="translate(180 0) scale(-1 1) rotate(8 90 95)">
