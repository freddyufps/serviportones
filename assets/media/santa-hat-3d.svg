 <path d="M61 63c16-25 34-40 57-50-10 26-7 45 6 61-18-7-39-12-63-11Z" fill="#ff8580" opacity=".32"/>
 <path d="M26 128c33-12 93-9 131 7l-2 23c-39-13-96-15-134 0Z" fill="url(#fur)" stroke="#d8d5d0" stroke-width="2"/>
 <path d="M35 134c30-9 83-8 113 3" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" opacity=".86"/>
 <g class="bulbs" filter="url(#glow)"><circle cx="44" cy="133" r="4.5" fill="#fbd567"/><circle cx="63" cy="129" r="4.5" fill="#f56867"/><circle cx="82" cy="128" r="4.5" fill="#6bd39a"/><circle cx="101" cy="130" r="4.5" fill="#fbd567"/><circle cx="120" cy="133" r="4.5" fill="#f56867"/><circle cx="140" cy="138" r="4.5" fill="#6bd39a"/></g>
 <path d="M112 20c18 5 24 17 22 28-2 11-13 15-21 6-9-10-6-24-1-34Z" fill="#a51d2e" opacity=".48"/>
 <circle cx="128" cy="21" r="17" fill="url(#pom)" stroke="#d9d6d1" stroke-width="2"/><path d="M117 19q5-10 14-7" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" opacity=".8"/>
 <path d="M47 97c13-29 29-49 49-64" fill="none" stroke="#ffb2ad" stroke-width="3" stroke-linecap="round" opacity=".52"/>
 <path d="M76 28l3 7 8 1-6 5 1 8-6-5-7 3 3-7-4-6 8 1Z" fill="#fff3bf" filter="url(#glow)"/>
</g>
<style>.bulbs circle{animation:glint 1.3s ease-in-out infinite alternate}.bulbs circle:nth-child(2){animation-delay:.2s}.bulbs circle:nth-child(3){animation-delay:.4s}.bulbs circle:nth-child(4){animation-delay:.6s}.bulbs circle:nth-child(5){animation-delay:.8s}.bulbs circle:nth-child(6){animation-delay:1s}@keyframes glint{to{opacity:.55;filter:brightness(1.5)}}@media(prefers-reduced-motion:reduce){.bulbs circle{animation:none}}</style>
</svg>